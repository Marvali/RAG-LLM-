<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agentic RAG · F1 2026</title>

  <!-- Tailwind (CDN, modo JIT en browser) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 + Babel standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: 220 38 38;          /* rojo F1 */
      --accent-soft: 251 113 133;
      --accent-2: 250 204 21;       /* amarillo */
    }
    html, body, #root {
      height: 100%;
      margin: 0;
      background: #050505;
      color: #f5f5f5;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    *, *::before, *::after { box-sizing: border-box; }

    /* ===== F1 Loader ===== */
    .f1-track {
      width: 140px;
      height: 140px;
      position: relative;
      margin: 0 auto;
    }
    .f1-track::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      border: 1px dashed rgba(255,255,255,0.15);
    }
    .f1-track::after {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 9999px;
      border: 1px dashed rgba(255,255,255,0.08);
    }
    .f1-orbit {
      position: absolute;
      inset: 0;
      animation: f1-spin 1.4s linear infinite;
      transform-origin: 50% 50%;
    }
    .f1-car {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      filter: drop-shadow(0 0 8px rgba(220,38,38,0.65));
    }
    .f1-trail {
      position: absolute;
      top: 6px;
      left: 50%;
      width: 6px;
      height: 30px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(220,38,38,0.85), rgba(220,38,38,0));
      border-radius: 9999px;
      filter: blur(2px);
    }
    @keyframes f1-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ===== Pulsing dot ===== */
    .pulse-dot {
      width: 8px; height: 8px; border-radius: 9999px;
      box-shadow: 0 0 12px currentColor;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50%      { opacity: 1;   transform: scale(1.15); }
    }

    /* ===== Scrollbar ===== */
    .nice-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .nice-scroll::-webkit-scrollbar-track { background: transparent; }
    .nice-scroll::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 9999px;
    }
    .nice-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.18);
    }

    /* ===== Glow ===== */
    .glow-red {
      box-shadow:
        0 0 0 1px rgba(220,38,38,0.35),
        0 0 32px rgba(220,38,38,0.25);
    }

    /* ===== Slider ===== */
    input[type="range"].f1-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 9999px;
      background: linear-gradient(90deg, rgba(220,38,38,0.7) 0%, rgba(220,38,38,0.7) var(--p,30%), rgba(255,255,255,0.1) var(--p,30%));
      outline: none;
    }
    input[type="range"].f1-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 9999px;
      background: #fff;
      border: 2px solid rgba(220,38,38,0.9);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(220,38,38,0.6);
    }
    input[type="range"].f1-range::-moz-range-thumb {
      width: 16px; height: 16px;
      border-radius: 9999px;
      background: #fff;
      border: 2px solid rgba(220,38,38,0.9);
      cursor: pointer;
    }

    /* ===== Fade-in ===== */
    .fade-in {
      animation: fade-in .35s ease both;
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Markdown-ish */
    .prose-rag pre {
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      overflow: auto;
    }
    .prose-rag code {
      background: rgba(255,255,255,0.06);
      padding: 1px 6px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
    }
    .prose-rag p { margin: 0 0 8px 0; line-height: 1.55; }
    .prose-rag ul, .prose-rag ol { margin: 4px 0 8px 18px; }
    .prose-rag h1, .prose-rag h2, .prose-rag h3 {
      font-weight: 600; margin: 6px 0 4px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useEffect, useMemo, useRef, useState, useCallback } = React;

    /* ============================================================
       CONFIG
    ============================================================ */
    // Si abres el HTML directamente sin servir desde FastAPI, cambia esto.
    const API_BASE = window.location.origin.startsWith("http")
      ? window.location.origin
      : "http://127.0.0.1:8000";

    const LS_CHAT_KEY = "rag_f1_chat_v1";
    const LS_SETTINGS_KEY = "rag_f1_settings_v1";

    /* ============================================================
       UTILS
    ============================================================ */
    function cls(...a) { return a.filter(Boolean).join(" "); }

    function bytes(n) {
      if (n == null) return "";
      const u = ["B", "KB", "MB", "GB"];
      let i = 0; let v = n;
      while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
      return `${v.toFixed(v < 10 ? 1 : 0)} ${u[i]}`;
    }

    function shortName(s, n = 36) {
      if (!s) return "";
      return s.length > n ? s.slice(0, n - 1) + "…" : s;
    }

    // Markdown ligero -> HTML (sin dependencias)
    function mdToHtml(md = "") {
      let s = md
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      // bloques de código
      s = s.replace(/```([\s\S]*?)```/g, (_m, c) => `<pre>${c.trim()}</pre>`);
      // inline code
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      // negrita / cursiva
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
      // títulos
      s = s.replace(/^### (.+)$/gm, "<h3>$1</h3>");
      s = s.replace(/^## (.+)$/gm, "<h2>$1</h2>");
      s = s.replace(/^# (.+)$/gm, "<h1>$1</h1>");
      // listas (-) muy básico
      s = s.replace(/(^|\n)((?:- .+(?:\n|$))+)/g, (m, p, list) => {
        const items = list.trim().split(/\n/).map(l => l.replace(/^- /, "").trim()).filter(Boolean);
        return `${p}<ul>${items.map(i => `<li>${i}</li>`).join("")}</ul>`;
      });
      // saltos de párrafo
      s = s.split(/\n\n+/).map(p => p.match(/^<(h\d|ul|ol|pre)/) ? p : `<p>${p.replace(/\n/g, "<br/>")}</p>`).join("");
      return s;
    }

    /* ============================================================
       API
    ============================================================ */
    async function apiGet(path) {
      const r = await fetch(API_BASE + path);
      if (!r.ok) throw new Error((await safeText(r)) || r.statusText);
      return r.json();
    }
    async function apiPost(path, body) {
      const r = await fetch(API_BASE + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!r.ok) throw new Error((await safeText(r)) || r.statusText);
      return r.json();
    }
    async function apiDelete(path) {
      const r = await fetch(API_BASE + path, { method: "DELETE" });
      if (!r.ok) throw new Error((await safeText(r)) || r.statusText);
      return r.json();
    }
    async function apiUpload(files) {
      const fd = new FormData();
      for (const f of files) fd.append("files", f, f.name);
      const r = await fetch(API_BASE + "/api/upload", { method: "POST", body: fd });
      if (!r.ok) throw new Error((await safeText(r)) || r.statusText);
      return r.json();
    }
    async function safeText(r) {
      try {
        const j = await r.json();
        return j.detail || JSON.stringify(j);
      } catch { try { return await r.text(); } catch { return ""; } }
    }

    /* ============================================================
       ICONOS (SVG inline)
    ============================================================ */
    const Icon = {
      Send: (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>),
      Chat: (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>),
      Cog: (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06A2 2 0 1 1 4.29 16.96l.06-.06A1.65 1.65 0 0 0 4.68 15 1.65 1.65 0 0 0 3.17 14H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.36.84 1.17 1.4 2.07 1.4H21a2 2 0 1 1 0 4h-.09c-.9 0-1.7.56-2.07 1.4z"/></svg>),
      Upload: (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8 12 3 7 8"/><path d="M12 3v12"/></svg>),
      Refresh: (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>),
      Trash: (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>),
      Doc: (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>),
      Plus: (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 5v14"/><path d="M5 12h14"/></svg>),
      Spark: (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 3v3"/><path d="M12 18v3"/><path d="M3 12h3"/><path d="M18 12h3"/><path d="M5.6 5.6l2.1 2.1"/><path d="M16.3 16.3l2.1 2.1"/><path d="M5.6 18.4l2.1-2.1"/><path d="M16.3 7.7l2.1-2.1"/></svg>),
      Layers: (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>),
    };

    /* ============================================================
       LOADER F1
    ============================================================ */
    function F1Loader({ label = "Pensando…" }) {
      return (
        <div className="flex flex-col items-center justify-center gap-4 fade-in">
          <div className="f1-track">
            <div className="f1-orbit">
              <div className="f1-trail" />
              <div className="f1-car">🏎️</div>
            </div>
          </div>
          <div className="text-xs uppercase tracking-[0.3em] text-white/60">{label}</div>
        </div>
      );
    }

    /* ============================================================
       SOURCE CARD
    ============================================================ */
    function SourceCard({ s, idx }) {
      const [open, setOpen] = useState(false);
      const score = (s.score * 100).toFixed(1);
      return (
        <div
          className="rounded-xl border border-white/10 bg-white/[0.04] hover:bg-white/[0.07] transition p-3 fade-in"
        >
          <div className="flex items-start gap-2">
            <div className="shrink-0 w-7 h-7 rounded-lg bg-red-600/20 border border-red-500/30 grid place-items-center text-[11px] font-semibold text-red-300">
              {idx + 1}
            </div>
            <div className="min-w-0 flex-1">
              <div className="text-[12px] text-white/90 font-medium truncate" title={s.documento}>
                {shortName(s.documento, 38)}
              </div>
              <div className="mt-0.5 flex items-center gap-2 text-[10.5px] text-white/50">
                <span>chunk #{s.chunk_id}</span>
                <span className="w-1 h-1 rounded-full bg-white/30" />
                <span className="text-emerald-300/90">score {score}%</span>
              </div>
            </div>
          </div>
          <button
            onClick={() => setOpen(o => !o)}
            className="mt-2 text-[11px] text-white/50 hover:text-white/80 transition"
          >
            {open ? "Ocultar fragmento" : "Ver fragmento"}
          </button>
          {open && (
            <pre className="mt-2 max-h-44 overflow-auto nice-scroll text-[11.5px] leading-relaxed text-white/75 whitespace-pre-wrap font-mono bg-black/40 border border-white/5 rounded-lg p-2">
{(s.chunk_text || "").slice(0, 1200)}
            </pre>
          )}
        </div>
      );
    }

    /* ============================================================
       MESSAGE BUBBLE
    ============================================================ */
    function Bubble({ m }) {
      const isUser = m.role === "user";
      return (
        <div className={cls("w-full flex", isUser ? "justify-end" : "justify-start")}>
          <div
            className={cls(
              "max-w-[78%] rounded-2xl px-4 py-3 fade-in",
              isUser
                ? "bg-gradient-to-br from-red-600 to-red-700 text-white shadow-[0_8px_30px_-10px_rgba(220,38,38,0.55)] border border-red-400/20"
                : "bg-white/[0.06] backdrop-blur-md border border-white/10 text-white/90"
            )}
          >
            {!isUser && (
              <div className="flex items-center gap-2 mb-1.5">
                <div className="w-5 h-5 rounded-md bg-red-500/15 border border-red-500/30 grid place-items-center">
                  <span className="text-[10px]">🏁</span>
                </div>
                <span className="text-[10.5px] uppercase tracking-[0.22em] text-white/45">Asistente</span>
              </div>
            )}
            <div
              className={cls("prose-rag text-[14px]", isUser ? "text-white" : "text-white/90")}
              dangerouslySetInnerHTML={{ __html: mdToHtml(m.content) }}
            />
          </div>
        </div>
      );
    }

    /* ============================================================
       APP
    ============================================================ */
    function App() {
      const [tab, setTab] = useState("chat"); // 'chat' | 'rag'
      const [status, setStatus] = useState(null);
      const [statusErr, setStatusErr] = useState(null);

      // Settings
      const initialSettings = (() => {
        try { return JSON.parse(localStorage.getItem(LS_SETTINGS_KEY)) || {}; } catch { return {}; }
      })();
      const [temperature, setTemperature] = useState(initialSettings.temperature ?? 0.2);
      const [topK, setTopK] = useState(initialSettings.topK ?? 5);
      const [useHistory, setUseHistory] = useState(initialSettings.useHistory ?? true);

      useEffect(() => {
        localStorage.setItem(LS_SETTINGS_KEY, JSON.stringify({ temperature, topK, useHistory }));
      }, [temperature, topK, useHistory]);

      // Chat
      const [messages, setMessages] = useState(() => {
        try {
          const raw = localStorage.getItem(LS_CHAT_KEY);
          if (raw) return JSON.parse(raw);
        } catch {}
        return [{
          role: "assistant",
          content: "Bienvenido al **Agentic RAG · F1 2026**. Pregúntame sobre el reglamento técnico, deportivo, financiero u operacional. Responderé citando los fragmentos del documento."
        }];
      });
      const [sources, setSources] = useState([]);
      const [input, setInput] = useState("");
      const [thinking, setThinking] = useState(false);
      const [chatErr, setChatErr] = useState(null);
      const scrollRef = useRef(null);

      useEffect(() => {
        try { localStorage.setItem(LS_CHAT_KEY, JSON.stringify(messages.slice(-100))); } catch {}
      }, [messages]);

      useEffect(() => {
        if (scrollRef.current) {
          scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }
      }, [messages, thinking]);

      // Status polling
      const refreshStatus = useCallback(async () => {
        try {
          const s = await apiGet("/api/status");
          setStatus(s);
          setStatusErr(null);
        } catch (e) {
          setStatusErr(String(e.message || e));
        }
      }, []);

      useEffect(() => {
        refreshStatus();
        const t = setInterval(refreshStatus, 6000);
        return () => clearInterval(t);
      }, [refreshStatus]);

      // RAG manager state
      const [rebuilding, setRebuilding] = useState(false);
      const [uploading, setUploading] = useState(false);
      const [ragErr, setRagErr] = useState(null);
      const [ragOk, setRagOk] = useState(null);
      const fileInputRef = useRef(null);

      async function handleSend() {
        const q = input.trim();
        if (!q || thinking) return;
        setInput("");
        setChatErr(null);
        const newHist = [...messages, { role: "user", content: q }];
        setMessages(newHist);
        setThinking(true);
        try {
          const payload = {
            question: q,
            top_k: topK,
            temperature,
            use_history: useHistory,
            history: messages.filter(m => m.role === "user" || m.role === "assistant"),
          };
          const r = await apiPost("/api/ask", payload);
          setSources(r.sources || []);
          setMessages(prev => [...prev, { role: "assistant", content: r.answer || "(sin respuesta)" }]);
        } catch (e) {
          setChatErr(String(e.message || e));
          setMessages(prev => [...prev, {
            role: "assistant",
            content: "⚠️ No he podido responder.\n\n```\n" + (e.message || e) + "\n```"
          }]);
        } finally {
          setThinking(false);
        }
      }

      function handleNewChat() {
        if (!confirm("¿Empezar una conversación nueva? Se perderá el historial actual.")) return;
        const fresh = [{
          role: "assistant",
          content: "Conversación reiniciada. Pregúntame algo sobre el reglamento F1 2026."
        }];
        setMessages(fresh);
        setSources([]);
      }

      async function handleUpload(files) {
        if (!files || files.length === 0) return;
        setUploading(true);
        setRagErr(null);
        setRagOk(null);
        try {
          const r = await apiUpload(files);
          setRagOk(`Subidos ${r.saved.length} PDF(s). Pulsa "Regenerar RAG" para indexarlos.`);
          await refreshStatus();
        } catch (e) {
          setRagErr(String(e.message || e));
        } finally {
          setUploading(false);
          if (fileInputRef.current) fileInputRef.current.value = "";
        }
      }

      async function handleDelete(name) {
        if (!confirm(`¿Borrar el PDF "${name}"?`)) return;
        try {
          await apiDelete(`/api/pdfs/${encodeURIComponent(name)}`);
          await refreshStatus();
        } catch (e) {
          setRagErr(String(e.message || e));
        }
      }

      async function handleRebuild() {
        if (rebuilding) return;
        setRebuilding(true);
        setRagErr(null);
        setRagOk(null);
        try {
          const r = await apiPost("/api/rebuild");
          setRagOk(`Índice regenerado: ${r.n_chunks} chunks indexados.`);
          await refreshStatus();
        } catch (e) {
          setRagErr(String(e.message || e));
        } finally {
          setRebuilding(false);
        }
      }

      const tempPercent = Math.round(temperature * 100);
      const topkPercent = Math.round((topK / 15) * 100);

      const ragReady = !!status?.ready;
      const llmOnline = !!status?.llm_connected;

      return (
        <div className="relative w-screen h-screen overflow-hidden text-white">
          {/* ===== Vídeo de fondo ===== */}
          <video autoPlay loop muted playsInline className="absolute inset-0 w-full h-full object-cover z-0">
            <source src="https://res.cloudinary.com/dfonotyfb/video/upload/v1775585556/dds3_1_rqhg7x.mp4" type="video/mp4" />
          </video>

          {/* Overlays oscuros + viñeta */}
          <div className="absolute inset-0 z-10 bg-black/60 pointer-events-none" />
          <div
            className="absolute inset-0 z-10 pointer-events-none"
            style={{ background: "radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.75) 70%, rgba(0,0,0,0.95) 100%)" }}
          />
          <div
            className="absolute inset-0 z-10 pointer-events-none mix-blend-overlay opacity-60"
            style={{ background: "linear-gradient(180deg, rgba(220,38,38,0.10) 0%, rgba(0,0,0,0) 35%, rgba(250,204,21,0.05) 100%)" }}
          />

          {/* ===== Layout ===== */}
          <div className="relative z-20 h-full w-full grid grid-cols-12 gap-4 p-4">

            {/* ====== SIDEBAR ====== */}
            <aside className="col-span-12 md:col-span-4 lg:col-span-3 flex flex-col gap-4 min-h-0">
              {/* Marca */}
              <div className="rounded-2xl border border-white/10 bg-white/[0.04] backdrop-blur-xl p-4 fade-in">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-red-600 to-red-800 grid place-items-center glow-red">
                    <span className="text-lg">🏁</span>
                  </div>
                  <div className="min-w-0">
                    <div className="text-[10.5px] uppercase tracking-[0.3em] text-white/45">Agentic RAG</div>
                    <div className="text-[15px] font-semibold leading-tight">F1 2026 · Asistente</div>
                  </div>
                </div>

                {/* Estado */}
                <div className="mt-4 grid grid-cols-2 gap-2">
                  <StatusPill
                    color={ragReady ? "emerald" : "amber"}
                    label="RAG"
                    value={ragReady ? "Listo" : (status?.rebuilding ? "Indexando" : "Vacío")}
                  />
                  <StatusPill
                    color={llmOnline ? "emerald" : "rose"}
                    label="LLM"
                    value={llmOnline ? "Online" : "Offline"}
                  />
                  <StatusPill color="sky" label="Chunks" value={status?.n_chunks ?? "—"} />
                  <StatusPill color="violet" label="Device" value={(status?.device || "—").toUpperCase()} />
                </div>

                {statusErr && (
                  <div className="mt-3 text-[11px] text-red-300/90 bg-red-500/10 border border-red-500/20 rounded-lg px-2 py-1.5">
                    API: {statusErr}
                  </div>
                )}
              </div>

              {/* Tabs */}
              <div className="rounded-2xl border border-white/10 bg-white/[0.04] backdrop-blur-xl p-1.5 grid grid-cols-2 gap-1.5">
                <TabButton active={tab === "chat"} onClick={() => setTab("chat")} icon={<Icon.Chat className="w-4 h-4" />}>
                  Chat
                </TabButton>
                <TabButton active={tab === "rag"} onClick={() => setTab("rag")} icon={<Icon.Layers className="w-4 h-4" />}>
                  RAG
                </TabButton>
              </div>

              {/* Settings */}
              <div className="rounded-2xl border border-white/10 bg-white/[0.04] backdrop-blur-xl p-4">
                <div className="flex items-center gap-2 text-[11px] uppercase tracking-[0.25em] text-white/55">
                  <Icon.Cog className="w-3.5 h-3.5" /> Modelo
                </div>

                <div className="mt-3">
                  <div className="flex items-center justify-between text-[12px] text-white/70">
                    <span>Temperatura</span>
                    <span className="font-mono text-white/90">{temperature.toFixed(2)}</span>
                  </div>
                  <input
                    type="range"
                    min="0" max="1" step="0.05"
                    value={temperature}
                    onChange={(e) => setTemperature(parseFloat(e.target.value))}
                    className="f1-range mt-2"
                    style={{ "--p": `${tempPercent}%` }}
                  />
                  <div className="flex justify-between text-[10px] text-white/40 mt-1">
                    <span>Preciso</span><span>Creativo</span>
                  </div>
                </div>

                <div className="mt-4">
                  <div className="flex items-center justify-between text-[12px] text-white/70">
                    <span>Top-K (fragmentos)</span>
                    <span className="font-mono text-white/90">{topK}</span>
                  </div>
                  <input
                    type="range"
                    min="1" max="15" step="1"
                    value={topK}
                    onChange={(e) => setTopK(parseInt(e.target.value, 10))}
                    className="f1-range mt-2"
                    style={{ "--p": `${topkPercent}%` }}
                  />
                </div>

                <label className="mt-4 flex items-center gap-2 text-[12px] text-white/75 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={useHistory}
                    onChange={(e) => setUseHistory(e.target.checked)}
                    className="accent-red-500"
                  />
                  Usar historial de la conversación
                </label>
              </div>

              {/* Sources */}
              <div className="rounded-2xl border border-white/10 bg-white/[0.04] backdrop-blur-xl p-4 flex-1 min-h-0 flex flex-col">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2 text-[11px] uppercase tracking-[0.25em] text-white/55">
                    <Icon.Spark className="w-3.5 h-3.5" /> Fuentes consultadas
                  </div>
                  <span className="text-[11px] text-white/45">{sources.length}</span>
                </div>

                <div className="mt-3 overflow-y-auto nice-scroll pr-1 space-y-2">
                  {sources.length === 0 && (
                    <div className="text-[12px] text-white/45 leading-relaxed">
                      Cuando hagas una pregunta, aquí aparecerán los fragmentos
                      del PDF que la IA usó como evidencia, con su score de
                      similitud y un extracto.
                    </div>
                  )}
                  {sources.map((s, i) => <SourceCard key={i} s={s} idx={i} />)}
                </div>
              </div>
            </aside>

            {/* ====== MAIN ====== */}
            <main className="col-span-12 md:col-span-8 lg:col-span-9 min-h-0 min-w-0 flex flex-col gap-4">
              {tab === "chat" && (
                <ChatView
                  messages={messages}
                  thinking={thinking}
                  scrollRef={scrollRef}
                  input={input}
                  setInput={setInput}
                  onSend={handleSend}
                  onNewChat={handleNewChat}
                  chatErr={chatErr}
                  status={status}
                />
              )}
              {tab === "rag" && (
                <RagView
                  status={status}
                  rebuilding={rebuilding}
                  uploading={uploading}
                  ragErr={ragErr}
                  ragOk={ragOk}
                  fileInputRef={fileInputRef}
                  onUpload={handleUpload}
                  onDelete={handleDelete}
                  onRebuild={handleRebuild}
                  onRefresh={refreshStatus}
                />
              )}
            </main>
          </div>
        </div>
      );
    }

    /* ============================================================
       SUBCOMPONENTES
    ============================================================ */
    function StatusPill({ color = "emerald", label, value }) {
      const map = {
        emerald: "text-emerald-300 border-emerald-400/25 bg-emerald-400/10",
        amber:   "text-amber-300 border-amber-400/25 bg-amber-400/10",
        rose:    "text-rose-300 border-rose-400/25 bg-rose-400/10",
        sky:     "text-sky-300 border-sky-400/25 bg-sky-400/10",
        violet:  "text-violet-300 border-violet-400/25 bg-violet-400/10",
      };
      return (
        <div className={cls("rounded-xl border px-2.5 py-1.5", map[color])}>
          <div className="flex items-center gap-1.5">
            <span className="pulse-dot" />
            <span className="text-[10px] uppercase tracking-[0.18em] opacity-80">{label}</span>
          </div>
          <div className="mt-0.5 text-[12.5px] font-medium text-white/95 truncate">{value}</div>
        </div>
      );
    }

    function TabButton({ active, onClick, icon, children }) {
      return (
        <button
          onClick={onClick}
          className={cls(
            "w-full px-3 py-2 rounded-xl text-[13px] font-medium flex items-center justify-center gap-2 transition",
            active
              ? "bg-gradient-to-br from-red-600 to-red-700 text-white shadow-[0_6px_22px_-8px_rgba(220,38,38,0.7)]"
              : "text-white/70 hover:text-white hover:bg-white/[0.06]"
          )}
        >
          {icon}{children}
        </button>
      );
    }

    /* ============================================================
       CHAT VIEW
    ============================================================ */
    function ChatView({ messages, thinking, scrollRef, input, setInput, onSend, onNewChat, chatErr, status }) {
      function onKeyDown(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          onSend();
        }
      }
      return (
        <>
          {/* Header */}
          <div className="rounded-2xl border border-white/10 bg-white/[0.04] backdrop-blur-xl px-4 py-3 flex items-center justify-between fade-in">
            <div className="min-w-0">
              <div className="text-[10.5px] uppercase tracking-[0.3em] text-white/45">Sesión activa</div>
              <div className="text-[15px] font-semibold truncate">
                Conversación con el reglamento F1 2026
              </div>
            </div>
            <div className="flex items-center gap-2">
              <span className="hidden md:inline text-[11px] text-white/55 font-mono">
                {status?.llm_model || "—"} · {status?.device?.toUpperCase() || "—"}
              </span>
              <button
                onClick={onNewChat}
                className="text-[12px] px-3 py-1.5 rounded-lg border border-white/10 hover:bg-white/[0.06] transition flex items-center gap-1.5"
                title="Nueva conversación"
              >
                <Icon.Plus className="w-3.5 h-3.5" /> Nueva
              </button>
            </div>
          </div>

          {/* Messages */}
          <div
            ref={scrollRef}
            className="flex-1 min-h-0 overflow-y-auto nice-scroll rounded-2xl border border-white/10 bg-black/30 backdrop-blur-xl p-4 md:p-6"
          >
            <div className="max-w-3xl mx-auto flex flex-col gap-4">
              {messages.map((m, i) => <Bubble key={i} m={m} />)}
              {thinking && (
                <div className="py-8">
                  <F1Loader label="El piloto está dando vueltas al circuito…" />
                </div>
              )}
            </div>
          </div>

          {chatErr && (
            <div className="text-[12px] text-red-300/90 bg-red-500/10 border border-red-500/20 rounded-xl px-3 py-2">
              {chatErr}
            </div>
          )}

          {/* Input */}
          <div className="rounded-2xl border border-white/10 bg-white/[0.04] backdrop-blur-xl p-2 fade-in">
            <div className="flex items-end gap-2">
              <textarea
                rows={1}
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={onKeyDown}
                placeholder="Pregunta sobre el reglamento (ej: ¿Cuántas unidades de potencia puede usar un equipo?)"
                className="flex-1 resize-none bg-transparent outline-none px-3 py-2.5 text-[14px] placeholder-white/40 max-h-40 nice-scroll"
                style={{ minHeight: 42 }}
              />
              <button
                onClick={onSend}
                disabled={thinking || !input.trim()}
                className={cls(
                  "shrink-0 h-10 px-4 rounded-xl flex items-center gap-2 text-[13px] font-medium transition",
                  thinking || !input.trim()
                    ? "bg-white/[0.06] text-white/40 cursor-not-allowed"
                    : "bg-gradient-to-br from-red-600 to-red-700 text-white shadow-[0_6px_22px_-8px_rgba(220,38,38,0.7)] hover:brightness-110"
                )}
              >
                <Icon.Send className="w-4 h-4" /> Enviar
              </button>
            </div>
            <div className="px-3 pb-1 pt-0.5 flex items-center justify-between text-[10.5px] text-white/40">
              <span>Enter para enviar · Shift+Enter para nueva línea</span>
              <span className="font-mono">{input.length} chars</span>
            </div>
          </div>
        </>
      );
    }

    /* ============================================================
       RAG VIEW
    ============================================================ */
    function RagView({ status, rebuilding, uploading, ragErr, ragOk, fileInputRef, onUpload, onDelete, onRebuild, onRefresh }) {
      const [drag, setDrag] = useState(false);
      function onDragOver(e) { e.preventDefault(); setDrag(true); }
      function onDragLeave(e) { e.preventDefault(); setDrag(false); }
      function onDrop(e) {
        e.preventDefault(); setDrag(false);
        const files = Array.from(e.dataTransfer.files || []).filter(f => f.name.toLowerCase().endsWith(".pdf"));
        if (files.length) onUpload(files);
      }

      return (
        <>
          {/* Header */}
          <div className="rounded-2xl border border-white/10 bg-white/[0.04] backdrop-blur-xl px-4 py-3 flex items-center justify-between fade-in">
            <div>
              <div className="text-[10.5px] uppercase tracking-[0.3em] text-white/45">Pit lane</div>
              <div className="text-[15px] font-semibold">Gestor del RAG · Documentos & Reindexado</div>
            </div>
            <button
              onClick={onRefresh}
              className="text-[12px] px-3 py-1.5 rounded-lg border border-white/10 hover:bg-white/[0.06] transition flex items-center gap-1.5"
            >
              <Icon.Refresh className="w-3.5 h-3.5" /> Refrescar
            </button>
          </div>

          <div className="flex-1 min-h-0 grid grid-cols-1 xl:grid-cols-3 gap-4">
            {/* Upload + rebuild */}
            <div className="xl:col-span-1 flex flex-col gap-4 min-h-0">
              <div
                onDragOver={onDragOver}
                onDragLeave={onDragLeave}
                onDrop={onDrop}
                className={cls(
                  "rounded-2xl border-2 border-dashed transition p-6 text-center bg-white/[0.03] backdrop-blur-xl",
                  drag ? "border-red-400/70 bg-red-500/[0.07]" : "border-white/15 hover:border-white/30"
                )}
              >
                <div className="mx-auto w-12 h-12 rounded-2xl bg-red-500/15 border border-red-500/30 grid place-items-center">
                  <Icon.Upload className="w-5 h-5 text-red-300" />
                </div>
                <div className="mt-3 text-[14px] font-medium">Arrastra PDFs aquí</div>
                <div className="text-[12px] text-white/55 mt-1">o haz clic para seleccionar archivos</div>

                <input
                  ref={fileInputRef}
                  type="file"
                  accept="application/pdf"
                  multiple
                  className="hidden"
                  onChange={(e) => onUpload(Array.from(e.target.files || []))}
                />
                <button
                  disabled={uploading}
                  onClick={() => fileInputRef.current?.click()}
                  className={cls(
                    "mt-4 inline-flex items-center gap-2 px-4 py-2 rounded-xl text-[13px] font-medium transition",
                    uploading
                      ? "bg-white/[0.06] text-white/40"
                      : "bg-white/[0.08] hover:bg-white/[0.13] text-white border border-white/10"
                  )}
                >
                  <Icon.Plus className="w-4 h-4" /> {uploading ? "Subiendo…" : "Seleccionar PDFs"}
                </button>
              </div>

              <div className="rounded-2xl border border-white/10 bg-white/[0.04] backdrop-blur-xl p-5">
                <div className="flex items-center gap-2 text-[11px] uppercase tracking-[0.25em] text-white/55">
                  <Icon.Refresh className="w-3.5 h-3.5" /> Regenerar índice
                </div>
                <p className="text-[12.5px] text-white/65 mt-2 leading-relaxed">
                  Si añades, eliminas o cambias PDFs, regenera el RAG para
                  actualizar embeddings y el índice FAISS.
                </p>
                <button
                  onClick={onRebuild}
                  disabled={rebuilding || (status?.n_pdfs ?? 0) === 0}
                  className={cls(
                    "mt-4 w-full px-4 py-2.5 rounded-xl text-[13px] font-semibold transition flex items-center justify-center gap-2",
                    rebuilding
                      ? "bg-white/[0.06] text-white/50 cursor-not-allowed"
                      : (status?.n_pdfs ?? 0) === 0
                        ? "bg-white/[0.06] text-white/35 cursor-not-allowed"
                        : "bg-gradient-to-br from-red-600 to-red-700 text-white shadow-[0_6px_22px_-8px_rgba(220,38,38,0.7)] hover:brightness-110"
                  )}
                >
                  {rebuilding ? (
                    <>
                      <span className="w-4 h-4 rounded-full border-2 border-white/40 border-t-white animate-spin" />
                      Regenerando…
                    </>
                  ) : (
                    <>
                      <Icon.Refresh className="w-4 h-4" /> Regenerar RAG
                    </>
                  )}
                </button>

                {rebuilding && (
                  <div className="mt-5">
                    <F1Loader label="Indexando vuelta tras vuelta…" />
                  </div>
                )}

                {ragOk && (
                  <div className="mt-3 text-[12px] text-emerald-300 bg-emerald-500/10 border border-emerald-500/25 rounded-lg px-3 py-2">
                    ✓ {ragOk}
                  </div>
                )}
                {ragErr && (
                  <div className="mt-3 text-[12px] text-red-300 bg-red-500/10 border border-red-500/25 rounded-lg px-3 py-2 break-words">
                    ✗ {ragErr}
                  </div>
                )}
              </div>

              {/* Info backend */}
              <div className="rounded-2xl border border-white/10 bg-white/[0.04] backdrop-blur-xl p-5 text-[12px] text-white/65 space-y-1.5 font-mono">
                <div><span className="text-white/40">embed:</span> {status?.embedding_model || "—"}</div>
                <div><span className="text-white/40">device:</span> {status?.device || "—"}</div>
                <div><span className="text-white/40">llm:</span> {status?.llm_model || "—"}</div>
                <div className="break-all"><span className="text-white/40">lm_studio:</span> {status?.lm_studio_url || "—"}</div>
              </div>
            </div>

            {/* Lista de PDFs */}
            <div className="xl:col-span-2 rounded-2xl border border-white/10 bg-white/[0.04] backdrop-blur-xl p-5 min-h-0 flex flex-col">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2 text-[11px] uppercase tracking-[0.25em] text-white/55">
                  <Icon.Doc className="w-3.5 h-3.5" /> Documentos en data/
                </div>
                <span className="text-[11px] text-white/45">
                  {status?.n_pdfs ?? 0} archivo(s) · {status?.n_chunks ?? 0} chunks indexados
                </span>
              </div>

              <div className="mt-4 flex-1 overflow-y-auto nice-scroll pr-1">
                {(!status?.pdfs || status.pdfs.length === 0) && (
                  <div className="h-full grid place-items-center text-center text-white/55 text-[13px] py-10">
                    No hay PDFs cargados todavía.
                    <br />Sube algún archivo para empezar.
                  </div>
                )}

                <div className="space-y-2">
                  {status?.pdfs?.map((p) => (
                    <div
                      key={p.name}
                      className="rounded-xl border border-white/10 bg-white/[0.03] hover:bg-white/[0.06] transition px-3 py-2.5 flex items-center gap-3"
                    >
                      <div className="w-9 h-9 rounded-lg bg-red-500/10 border border-red-500/25 grid place-items-center shrink-0">
                        <Icon.Doc className="w-4 h-4 text-red-300" />
                      </div>
                      <div className="min-w-0 flex-1">
                        <div className="text-[13px] font-medium truncate" title={p.name}>{p.name}</div>
                        <div className="text-[11px] text-white/45 font-mono">{bytes(p.size)}</div>
                      </div>
                      <button
                        onClick={() => onDelete(p.name)}
                        className="shrink-0 w-8 h-8 rounded-lg border border-white/10 hover:border-red-400/40 hover:bg-red-500/10 hover:text-red-300 transition grid place-items-center text-white/55"
                        title="Borrar"
                      >
                        <Icon.Trash className="w-4 h-4" />
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </>
      );
    }

    /* ============================================================
       MOUNT
    ============================================================ */
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
