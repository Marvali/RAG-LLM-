<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agentic RAG · F1 2026</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 + ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone (transforma JSX en el browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- ── Estilos de la app ── -->
  <link rel="stylesheet" href="/web/css/styles.css">
</head>
<body>
  <div id="root"></div>

  <!-- ── Módulos JS sin JSX (variables globales) ── -->
  <script src="/web/js/config.js"></script>
  <script src="/web/js/utils.js"></script>
  <script src="/web/js/api.js"></script>

  <!-- ── Componentes React (JSX → compilados por Babel) ── -->
  <!-- El orden importa: cada archivo puede usar lo que definieron los anteriores -->

  <script type="text/babel" data-presets="env,react" src="/web/js/icons.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="/web/js/components.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="/web/js/settings-modal.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="/web/js/sidebar.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="/web/js/chat-view.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="/web/js/rag-view.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="/web/js/app.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="/web/js/main.jsx"></script>

</body>
</html>
